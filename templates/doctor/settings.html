{% extends "layouts/doctor_base.html" %}

{% block content %}
<header class="dashboard-header">
    <div>
        <p class="tag">Cuenta</p>
        <h1>Configuración</h1>
    </div>
</header>
<div class="card">
    <h3>Preferencias de la cuenta</h3>
    <div style="margin-top: 24px;">
        <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer;">
            <input type="checkbox" checked>
            <span>Recibir notificaciones por correo</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer;">
            <input type="checkbox" checked>
            <span>Recordatorios de citas por SMS</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer;">
            <input type="checkbox">
            <span>Autenticación de dos factores (2FA)</span>
        </label>
    </div>

    <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--border-color);">
        <h3 style="color: #dc2626;">Zona de peligro</h3>
        <p style="margin-bottom: 16px; font-size: 14px; color: var(--text-sec);">Estas acciones no se pueden deshacer.
        </p>
        <button class="ghost-btn" style="color: #dc2626; border-color: #dc2626;">Desactivar cuenta</button>
    </div>
</div>
{% endblock %}
