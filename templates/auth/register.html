{% extends "layouts/healthconnect_base.html" %}

{% block title %}Registro | Health Connect{% endblock %}

{% block content %}
<section class="hero"
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 0;">
    <div class="modal"
        style="position: relative; transform: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 600px; width: 100%;">
        <div class="modal-header">
            <h3>Registro Health Connect</h3>
        </div>

        <script>
            function toggleRole(role) {
                document.querySelectorAll('[data-role-btn]').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-role-btn="${role}"]`).classList.add('active');

                document.getElementById('roleInput').value = role;

                if (role === 'doctor') {
                    document.getElementById('doctor-fields').hidden = false;
                    document.getElementById('patient-fields').hidden = true;
                } else {
                    document.getElementById('doctor-fields').hidden = true;
                    document.getElementById('patient-fields').hidden = false;
                }
            }
        </script>

        <div class="role-toggle">
            <button type="button" class="active" data-role-btn="doctor" onclick="toggleRole('doctor')">Médico</button>
            <button type="button" data-role-btn="patient" onclick="toggleRole('patient')">Paciente</button>
        </div>

        <form class="form-grid" method="POST">
            <input type="hidden" name="role" id="roleInput" value="doctor" />

            <!-- CAMPOS COMUNES -->
            <label>Email</label>
            <input name="email" type="email" placeholder="tu@email.com" required />

            <label>Contraseña</label>
            <input name="password" type="password" placeholder="••••••••" required />

            <!-- CAMPOS DOCTOR -->
            <div id="doctor-fields">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Nombre</label>
                    <input name="first_name" type="text" placeholder="Valentina"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Apellido</label>
                    <input name="last_name" type="text" placeholder="Ortiz"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Cédula / matrícula</label>
                    <input name="license_number" type="text" placeholder="HC-29384"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Especialidad</label>
                    <input name="specialties" type="text" placeholder="Cardiología"
                        style="width: 100%; box-sizing: border-box;" />
                </div>
            </div>

            <!-- CAMPOS PACIENTE -->
            <div id="patient-fields" hidden>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Nombre</label>
                    <input name="first_name" type="text" placeholder="Lucía"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">Apellido</label>
                    <input name="last_name" type="text" placeholder="Pérez"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;">País</label>
                    <input name="country" type="text" placeholder="México"
                        style="width: 100%; box-sizing: border-box;" />
                </div>
            </div>

            <p class="form-hint">
                * Tus datos están protegidos por Health Connect.
            </p>
            <button class="primary-btn" type="submit">Crear cuenta</button>

            <p style="text-align: center; margin-top: 1rem; font-size: 0.9em;">
                ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--primary);">Inicia sesión</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
