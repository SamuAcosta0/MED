{% extends "layouts/healthconnect_base.html" %}

{% block title %}Registro | Gregos{% endblock %}

{% block content %}
<section class="hero"
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 0;">
    <div class="modal"
        style="position: relative; transform: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 600px; width: 100%;">
        <div class="modal-header">
            <h3 data-i18n-es="Únete a Gregos" data-i18n-en="Join Gregos">Únete a Gregos</h3>
        </div>

        <script>
            function toggleRole(role) {
                document.querySelectorAll('[data-role-btn]').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-role-btn="${role}"]`).classList.add('active');

                document.getElementById('roleInput').value = role;

                if (role === 'doctor') {
                    document.getElementById('doctor-fields').hidden = false;
                    document.getElementById('patient-fields').hidden = true;
                } else {
                    document.getElementById('doctor-fields').hidden = true;
                    document.getElementById('patient-fields').hidden = false;
                }
            }
        </script>

        <div class="role-toggle">
            <button type="button" class="active" data-role-btn="doctor" onclick="toggleRole('doctor')"
                data-i18n-es="Médico" data-i18n-en="Doctor">Médico</button>
            <button type="button" data-role-btn="patient" onclick="toggleRole('patient')" data-i18n-es="Paciente"
                data-i18n-en="Patient">Paciente</button>
        </div>

        <form class="form-grid" method="POST">
            <input type="hidden" name="role" id="roleInput" value="doctor" />

            <!-- CAMPOS COMUNES -->
            <label data-i18n-es="Correo electrónico" data-i18n-en="Email address">Email</label>
            <input name="email" type="email" placeholder="tu@email.com" required />

            <label data-i18n-es="Contraseña" data-i18n-en="Password">Contraseña</label>
            <input name="password" type="password" placeholder="••••••••" required />

            <!-- CAMPOS DOCTOR -->
            <div id="doctor-fields">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Nombre"
                        data-i18n-en="First Name">Nombre</label>
                    <input name="first_name" type="text" placeholder="Valentina"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Apellido"
                        data-i18n-en="Last Name">Apellido</label>
                    <input name="last_name" type="text" placeholder="Ortiz"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Cédula / matrícula"
                        data-i18n-en="License Number">Cédula / matrícula</label>
                    <input name="license_number" type="text" placeholder="G-29384"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Especialidad"
                        data-i18n-en="Specialty">Especialidad</label>
                    <input name="specialties" type="text" placeholder="Cardiología"
                        style="width: 100%; box-sizing: border-box;" />
                </div>
            </div>

            <!-- CAMPOS PACIENTE -->
            <div id="patient-fields" hidden>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Nombre"
                        data-i18n-en="First Name">Nombre</label>
                    <input name="first_name" type="text" placeholder="Lucía"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="Apellido"
                        data-i18n-en="Last Name">Apellido</label>
                    <input name="last_name" type="text" placeholder="Pérez"
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 6px;" data-i18n-es="País / Región"
                        data-i18n-en="Country / Region">País</label>
                    <input name="country" type="text" placeholder="México"
                        style="width: 100%; box-sizing: border-box;" />
                </div>
            </div>

            <p class="form-hint" data-i18n-es="* Tus datos están protegidos por el sistema de seguridad de Gregos."
                data-i18n-en="* Your data is protected by Gregos' security system.">
                * Tus datos están protegidos por el sistema de seguridad de Gregos.
            </p>
            <button class="primary-btn" type="submit" data-i18n-es="Crear cuenta" data-i18n-en="Create account">Crear
                cuenta</button>

            <p style="text-align: center; margin-top: 1rem; font-size: 0.9em;">
                <span data-i18n-es="¿Ya tienes cuenta?" data-i18n-en="Already have an account?">¿Ya tienes
                    cuenta?</span>
                <a href="{{ url_for('login') }}" style="color: var(--gold); font-weight: 700;"
                    data-i18n-es="Inicia sesión" data-i18n-en="Login">Inicia sesión</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
