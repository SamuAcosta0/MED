{% extends "layouts/healthconnect_base.html" %}

{% block title %}Iniciar Sesión | Gregos{% endblock %}

{% block content %}
<section class="hero" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="modal" style="position: relative; transform: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="modal-header">
            <h3 data-i18n-es="Iniciar sesión" data-i18n-en="Login">Iniciar sesión</h3>
        </div>
        <form class="form-grid" method="POST">
            <label for="login-email" data-i18n-es="Usuario o correo" data-i18n-en="Username or email">Usuario o
                correo</label>
            <input id="login-email" name="email" type="email" placeholder="doctor@gregos.com" required />

            <label for="login-password" data-i18n-es="Contraseña" data-i18n-en="Password">Contraseña</label>
            <input id="login-password" name="password" type="password" placeholder="••••••••" required />

            <div style="margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 0.9em;">
                    <input type="checkbox" name="remember" value="true">
                    <span data-i18n-es="Recordarme" data-i18n-en="Remember me">Recordarme</span>
                </label>
            </div>

            <p class="form-hint"
                data-i18n-es="Si eres médico ingresarás al panel médico. Si eres paciente, accederás a tu panel personal."
                data-i18n-en="If you are a doctor you will enter the medical panel. If you are a patient, you will access your personal panel.">
                Si eres médico ingresarás al panel médico. Si eres paciente, accederás a tu panel personal.
            </p>
            <button class="primary-btn" type="submit" data-i18n-es="Ingresar" data-i18n-en="Login">Ingresar</button>

            <p style="text-align: center; margin-top: 1rem; font-size: 0.9em;">
                <span data-i18n-es="¿No tienes cuenta?" data-i18n-en="Don't have an account?">¿No tienes cuenta?</span>
                <a href="{{ url_for('register') }}" style="color: var(--gold); font-weight: 700;"
                    data-i18n-es="Regístrate aquí" data-i18n-en="Register here">Regístrate aquí</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
